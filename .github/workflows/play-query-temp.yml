name: Play Console Query (temp)

# Temporary: query Play Console track status using the CI service account.
# Output is not secret (track names / release info); the key itself is masked by GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: pip install google-auth google-api-python-client

      - name: Write service account key
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > $RUNNER_TEMP/play.json

      - name: Normalize key file
        run: |
          python3 - <<'EOF'
          import json, re, os, sys
          path = os.environ["RUNNER_TEMP"] + "/play.json"
          text = open(path).read()
          try:
              json.loads(text); print("raw JSON OK"); sys.exit(0)
          except Exception:
              pass
          t = re.sub(r",\s*$", "", text, flags=re.M)          # strip trailing commas
          t = re.sub(r"^(\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*:)", r'\1"\2"\3', t, flags=re.M)  # quote keys
          if not t.lstrip().startswith("{"):
              t = "{\n" + t + "\n}"
          try:
              data = json.loads(t)
          except Exception as e:
              print("reconstruction failed:", e); sys.exit(1)
          json.dump(data, open(path, "w"))
          print("normalized: keys =", sorted(data.keys()))
          print("project_id =", data.get("project_id"), "| client_email =", data.get("client_email"))
          EOF

      - name: Query tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play.json
        run: python3 scripts/query-play-console.py
