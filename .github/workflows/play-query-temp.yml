name: Play Console Query (temp)

# Temporary: query Play Console track status using the CI service account.
# Output is not secret (track names / release info); the key itself is masked by GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: pip install google-auth google-api-python-client

      - name: Write service account key
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -c "import os; open(os.environ['RUNNER_TEMP']+'/play.json','w').write(os.environ['PLAY_KEY'])"

      - name: Verify key parses as JSON
        run: |
          python3 - <<'EOF'
          import json, os
          path = os.environ["RUNNER_TEMP"] + "/play.json"
          data = json.load(open(path))
          print("key OK: project_id =", data.get("project_id"))
          EOF

      - name: Query tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}/play.json
        run: python3 scripts/query-play-console.py
