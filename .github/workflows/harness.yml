name: Build Harness APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.14.1
          restore-keys: robolectric-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release.keystore

      - name: Build signed harness APK
        run: ./gradlew assembleHarness
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Cleanup keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-harness
          path: |
            app/build/outputs/apk/harness/*.apk
          retention-days: 7

      - name: Publish harness APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: harness-${{ github.run_number }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/harness/*.apk
          body: |
            Automated harness build #${{ github.run_number }} from commit ${{ github.sha }}.
            Download the APK and install via ADB (harness build type — retention ON, shadow ON).

      - name: Prune GitHub binary assets (keep newest 7)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-github-assets.sh
