name: F-Droid APK (reproducible)

# Publishes a signed release APK (for F-Droid reproducible-build verification)
# WITHOUT touching the Play Store AAB pipeline (release.yml). The APK is built
# with the release signing key (RELEASE_KEYSTORE secret) so fdroidserver's
# from-source build can byte-match it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building reproducible APK for $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # Full history so VERSION_DISPLAY's commit-count matches F-Droid's full checkout.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # packages 'tools' removed from the SDK repo (setup-android#537) — AGP
        # installs the platform/build-tools it needs once licenses are accepted.
        with:
          packages: platform-tools

      - name: Setup Gradle cache
        # validate-wrappers off: this workflow checks out the tag, and older
        # tags contain wrapper jars not in the official checksum database.
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > app/release.keystore

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Stage APK (stable name)
        run: |
          cp app/build/outputs/apk/release/app-release.apk polished-recognition.apk
          ls -la polished-recognition.apk

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" polished-recognition.apk --clobber

      - name: Prune GitHub binary assets (keep newest 7)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cleanup-github-assets.sh
